
name: DevHub CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-build:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            runawaydegree2911/devhub-frontend:latest
            runawaydegree2911/devhub-frontend:sha-${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            runawaydegree2911/devhub-backend:latest
            runawaydegree2911/devhub-backend:sha-${{ github.sha }}

  deploy-kubernetes:
    name: Deploy to local Kubernetes
    runs-on: [self-hosted, linux, x64]
    needs: [frontend-build, backend-build, publish-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get deployments -n devhub

      - name: Update frontend image
        run: |
          kubectl set image deployment/devhub-frontend \
            frontend=runawaydegree2911/devhub-frontend:sha-${GITHUB_SHA} \
            -n devhub

      - name: Update backend image
        run: |
          kubectl set image deployment/devhub-backend \
            backend=runawaydegree2911/devhub-backend:sha-${GITHUB_SHA} \
            -n devhub

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/devhub-frontend \
            -n devhub --timeout=180s
          kubectl rollout status deployment/devhub-backend \
            -n devhub --timeout=180s

