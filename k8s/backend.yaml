apiVersion: apps/v1
kind: Deployment
metadata:
  name: devhub-backend
  namespace: devhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devhub-backend
  template:
    metadata:
      labels:
        app: devhub-backend
    spec:
      containers:
        - name: backend
          image: runawaydegree2911/devhub-backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: FRONTEND_ORIGIN
              value: "http://localhost:8081"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: devhub-backend-secrets
                  key: MONGODB_URI
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devhub-backend-secrets
                  key: GITHUB_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: devhub-backend
  namespace: devhub
spec:
  selector:
    app: devhub-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
