apiVersion: apps/v1
kind: Deployment
metadata:
  name: devhub-frontend
  namespace: devhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devhub-frontend
  template:
    metadata:
      labels:
        app: devhub-frontend
    spec:
      containers:
        - name: frontend
          image: runawaydegree2911/devhub-frontend:1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devhub-frontend
  namespace: devhub
spec:
  type: ClusterIP
  selector:
    app: devhub-frontend
  ports:
    - port: 80
      targetPort: 80
