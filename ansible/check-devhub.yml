
---
- name: Validate DevHub Kubernetes deployment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check Kubernetes node status
      ansible.builtin.command:
        cmd: kubectl get nodes
      register: node_status
      changed_when: false

    - name: Display Kubernetes nodes
      ansible.builtin.debug:
        var: node_status.stdout_lines

    - name: Wait for frontend rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/devhub-frontend -n devhub --timeout=60s
      changed_when: false

    - name: Wait for backend rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/devhub-backend -n devhub --timeout=60s
      changed_when: false

    - name: Check DevHub services
      ansible.builtin.command:
        cmd: kubectl get services -n devhub
      register: services
      changed_when: false

    - name: Display DevHub services
      ansible.builtin.debug:
        var: services.stdout_lines

