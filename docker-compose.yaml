services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:4000
    container_name: devhub-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: devhub-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_ORIGIN: http://localhost:8080
